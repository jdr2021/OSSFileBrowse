# 允许在 WebView 中显示的文件扩展名；留空表示全部格式
# allow.extensions=.jpg,.jpeg,.png,.gif,.webp,.txt,.pdf,.docx,.xlsx,.mp4,.zip
allow.extensions=

# 文件预览大小上限；留空表示不限制；格式为数字加 M 或 G，例如 100M、2G
preview.max.size=

# true：兼容证书过期、自签名或主机名不匹配的 HTTPS 存储桶
# 可用 JVM 参数 -Dossfilebrowse.ignoreSsl=false 临时恢复严格校验
ignore.ssl=true

# 勾选后启用外部 FFmpeg 配置；路径失效时使用随包 JavaCV/FFmpeg
ffmpeg.enabled=false
ffmpeg.path=

# 勾选后全部远端文件交给 kkFileView 的 /onlinePreview?url= 接口
kkfileview.enabled=false
kkFileView_URL=https://file.kkview.cn/
